name: CI

# Trigger only on:
#   - direct pushes to main (catches anything that bypassed PR review)
#   - every pull request (the normal path)
# Feature-branch pushes don't trigger CI, which keeps Actions minutes low.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an older in-progress CI run when a newer commit is pushed to the
# same branch. Prevents wasted minutes when you rapid-fire push fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only repo permissions. CI doesn't need to write anything.
permissions:
  contents: read

jobs:
  # ── Lint job ──────────────────────────────────────────────────────────────
  # Runs pre-commit on every file: ruff lint + format + hygiene + secret scan.
  # Independent of the test job — failures here don't block tests from running.
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      # Pre-commit downloads each hook's environment on first run (~30s).
      # Caching .cache/pre-commit makes subsequent CI runs ~5s instead.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ── Test job ──────────────────────────────────────────────────────────────
  # Spins up Postgres + pgvector as a service container, runs pytest against
  # the test database that pytest-django auto-provisions.
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    # Service containers — GitHub starts these BEFORE the steps run. We get
    # Postgres on localhost:5432 with pgvector already installed in the image.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: agent_sql
        ports:
          - 5432:5432
        # GitHub waits for the healthcheck to pass before starting our steps.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Env vars Django + LangGraph need to boot. Dummy values — real API keys
    # aren't needed because we don't hit Groq/Gemini in the current test suite.
    env:
      DEBUG: "True"
      SECRET_KEY: ci-dummy-secret-key-not-for-production-do-not-use-this  # pragma: allowlist secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_sql  # pragma: allowlist secret
      POSTGRES_DB: agent_sql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      GROQ_API_KEY: gsk_ci_dummy_not_real  # pragma: allowlist secret
      GEMINI_API_KEY: ci_dummy_not_real  # pragma: allowlist secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Enable pgvector on the base DB. pytest-django will clone-and-migrate
      # this into `test_agent_sql` automatically — extensions installed on
      # template1 propagate to new DBs.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          psql -h localhost -U postgres -d agent_sql -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run pytest
        run: pytest -v
