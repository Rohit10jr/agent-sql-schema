services:
  - type: web
    name: django-sqlagent-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn agent.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Wire DATABASE_URL to the Postgres service below
      - key: DATABASE_URL
        fromDatabase:
          name: django-sqlagent-db
          property: connectionString

databases:
  - name: django-sqlagent-db
    plan: free
    postgresMajorVersion: 16
