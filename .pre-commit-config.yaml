# Pre-commit hooks — run automatically on `git commit`. Bypass with
# `git commit --no-verify` in emergencies (don't make this a habit).
#
# First-time setup on a fresh clone:
#   uv pip install -r requirements-dev.txt
#   pre-commit install
#   pre-commit run --all-files        # baseline run, may auto-fix things

repos:
  # ── Ruff: lint + format (replaces flake8 + black + isort) ────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]            # auto-fix lint issues
      - id: ruff-format          # auto-format

  # ── Basic file hygiene ─────────────────────────────────────────────────
  # `requirements.txt` excluded from whitespace / line-ending hooks because
  # we regenerate it from pip freeze and want byte-perfect control over its
  # contents to avoid past UTF-16/BOM disasters.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^requirements.*\.txt$
      - id: end-of-file-fixer
        exclude: ^requirements.*\.txt$
      - id: check-yaml
        # Compose's `!reset` / `!override` tags would trip the default parser.
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]     # warn if >2 MB committed (samples/*.sqlite3 are fine)
      - id: mixed-line-ending
        args: [--fix=lf]         # normalize CRLF → LF on commit (Windows dev safety)
        exclude: ^requirements.*\.txt$

  # ── Secret scanner — blocks accidentally committed API keys ─────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # First run will create the baseline. Re-running scans only NEW secrets;
        # known/false-positive ones stay whitelisted in .secrets.baseline.
        exclude: |
          (?x)^(
            \.venv/.*|
            .*\.lock|
            .*\.sqlite3|
            .*\.min\.js
          )$
